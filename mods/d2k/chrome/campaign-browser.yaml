Background@CAMPAIGN_BROWSER_PANEL:
	Logic: CampaignBrowserLogic
	X: (WINDOW_WIDTH - WIDTH) / 2
	Y: (WINDOW_HEIGHT - HEIGHT) / 2
	Width: 682
	Height: 591
	Children:
		Label@CAMPAIGN_BROWSER_TITLE:
			Y: 20
			Width: PARENT_WIDTH
			Height: 25
			Text: label-campaign-title
			Align: Center
			Font: Bold
		Container@FACTION_SELECTION_PANEL:
			X: 15
			Y: 50
			Width: 640
			Height: 400
			Children:
				ScrollPanel@CAMPAIGN_LIST:
					X: 20
					Y: 170
					Width: PARENT_WIDTH - 250
					Height: PARENT_HEIGHT - 250
					CollapseHiddenChildren: True
					Children:
						ScrollItem@CAMPAIGN_TEMPLATE:
							Width: PARENT_WIDTH - 27
							Height: 25
							X: 2
							Visible: false
							EnableChildMouseOver: True
							Children:
								LabelWithTooltip@TITLE:
									X: 10
									Width: PARENT_WIDTH - 20
									Height: 25
									TooltipContainer: TOOLTIP_CONTAINER
									TooltipTemplate: SIMPLE_TOOLTIP
				# VideoPlayer@FACTION_SELECTION:
