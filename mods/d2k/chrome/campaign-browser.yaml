				# 	Width: PARENT_WIDTH / 3
				# 	Height: 25
		Button@START_BUTTON:
			X: PARENT_WIDTH - 140 - 130
			Y: PARENT_HEIGHT - 45
			Width: 120
			Height: 25
			Text: button-campaign-browser-panel-start
			Font: Bold
			Key: escape
		Button@BACK_BUTTON:
			X: PARENT_WIDTH - 140
			Y: PARENT_HEIGHT - 45
			Width: 120
			Height: 25
			Text: button-back
			Font: Bold
